name: Build and Release Signed APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write  # Ye line 403 error ko theek karegi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor & Vite
        run: |
          npm install -g vite
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Force Build Web App
        run: |
          mkdir -p dist
          npx vite build --outDir dist || cp index.html dist/

      - name: Initialize Capacitor
        run: |
          rm -rf android capacitor.config.json
          npx cap init "Smartedukmr" com.smartedukmr.app --web-dir dist
          npx cap add android

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "subprojects { configurations.all { resolutionStrategy { eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } } } }" >> android/build.gradle

      - name: Build Release APK
        run: |
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smartedukmr Release v1.0.${{ github.run_number }}
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
