name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          # Sabse pehle Vite aur TypeScript install karenge taaki .tsx build ho sake
          npm install -g vite typescript
          npm install @vitejs/plugin-react @capacitor/core @capacitor/android @capacitor/cli

      - name: Force Build Web App
        run: |
          # Agar package.json mein build script nahi hai, toh hum manual vite build chalayenge
          mkdir -p dist
          npx vite build --outDir dist || cp index.html dist/

      - name: Initialize Capacitor
        run: |
          # Purani files delete karke fresh init
          rm -rf android capacitor.config.json
          npx cap init "Smartedukmr" com.smartedukmr.app --web-dir dist
          npx cap add android

      - name: Build APK
        run: |
          npx cap copy
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Smartedukmr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
