name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare Folder
        run: |
          # Ek 'www' folder banayenge jahan saara code jayega
          mkdir -p www
          # Saari HTML, JS aur CSS files ko 'www' mein copy karein
          cp -r * www/ 2>/dev/null || :
          # Agar koi purana folder hai toh use delete karein taaki error na aaye
          rm -rf www/android www/node_modules www/www

      - name: Setup Capacitor
        run: |
          # Fresh configuration banayein
          rm -f capacitor.config.json
          npx cap init "Smartedukmr" com.smartedukmr.app --web-dir www
          npx cap add android

      - name: Build APK
        run: |
          npx cap copy
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Smartedukmr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
