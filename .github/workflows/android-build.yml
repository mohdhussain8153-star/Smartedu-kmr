name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          npm install -g vite
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Force Build Web App
        run: |
          mkdir -p dist
          npx vite build --outDir dist || cp index.html dist/

      - name: Initialize Capacitor
        run: |
          rm -rf android capacitor.config.json
          npx cap init "Smartedukmr" com.smartedukmr.app --web-dir dist
          npx cap add android

      - name: Build APK
        run: |
          npx cap copy
          cd android
          chmod +x gradlew
          # --no-daemon lagaya hai error fix karne ke liye
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smartedukmr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
