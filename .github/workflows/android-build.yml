name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          # Agar package.json nahi hai toh basic create kar dega
          if [ ! -f "package.json" ]; then
            npm init -y
            npm install @capacitor/core @capacitor/android @capacitor/cli
          else
            npm install || npm install --legacy-peer-deps
          fi

      - name: Prepare Web Directory
        run: |
          # Ye step check karega ki build folder hai ya nahi, nahi toh banayega
          if grep -q "build" package.json; then
            npm run build || mkdir -p dist
          else
            mkdir -p dist
          fi
          # Saari files ko dist mein copy karega taaki capacitor ko mil jayein
          cp -r index.html *.js *.css *.png *.jpg *.svg dist/ 2>/dev/null || :
          cp -r src/* dist/ 2>/dev/null || :

      - name: Setup Capacitor
        run: |
          # Pehle se bani config file delete karega taaki fresh start ho
          rm -rf capacitor.config.json
          npx cap init "Smartedukmr" com.smartedukmr.app --web-dir dist
          npx cap add android

      - name: Build APK
        run: |
          npx cap copy
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Smartedukmr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
