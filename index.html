<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F766E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Education Kashmir | Elevating Minds</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-emerald: #0F766E;
            --brand-mint: #5EEAD4;
            --brand-amber: #F59E0B;
            --heritage-saffron: #FF8C00;
            --heritage-chinar: #B22222;
            --heritage-valley: #006400;
            --bg-soothing: #F8FAFC;
            --bg-soothing-dark: #020617;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: var(--bg-soothing);
            color: #0F172A;
        }
        .dark body {
            background-color: var(--bg-soothing-dark);
            color: #F8FAFC;
        }
        .font-merriweather { font-family: 'Merriweather', serif; }
        @keyframes icon-pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px var(--brand-emerald)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 8px var(--brand-mint)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--brand-emerald)); }
        }
        .animated-app-icon { animation: icon-pulse 3s infinite ease-in-out; }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .glitter-smart {
            color: var(--heritage-saffron);
            background: linear-gradient(90deg, var(--heritage-saffron), #FFE082, var(--heritage-saffron));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }
        .glitter-education {
            color: var(--heritage-chinar);
            background: linear-gradient(90deg, var(--heritage-chinar), #FF5252, var(--heritage-chinar));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 5s linear infinite;
        }
        .glitter-kashmir {
            color: var(--heritage-valley);
            background: linear-gradient(90deg, var(--heritage-valley), #66BB6A, var(--heritage-valley));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 6s linear infinite;
        }
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
        }
        @keyframes firework-animation {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(8) translateY(-100px); opacity: 0; }
        }
        .glass-panel {
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .dark .glass-panel {
            background: rgba(2, 6, 23, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-interact { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-interact:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-interact:active { transform: translateY(0) scale(0.96); }
        .animate-marquee { animation: marquee 25s linear infinite; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
